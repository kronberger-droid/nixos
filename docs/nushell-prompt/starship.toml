# ~/.config/starship.toml
#
# Base is the upstream `nerd-font-symbols` preset (starship master), with the
# customisations below layered on top. The `[maven]` and `[os.symbols]` tables
# from the preset are dropped: starship master keeps adding new os.symbols
# variants that older starship releases don't know, and each unknown key makes
# it warn on every prompt. The os module is off by default, so losing its
# symbols costs nothing visible.

"$schema" = "https://starship.rs/config-schema.json"

command_timeout = 2000

# Single-line module row. `$all` is every module in default order, which
# *includes* a `$line_break` (after cmd_duration, pushing time/status onto a
# second line) and a trailing `$character` caret. Both are disabled below:
# line_break so all modules stay on one row, character to drop the caret.
#
# The real second line — the input line — comes from the PROMPT_COMMAND
# wrapper in config.nu. Don't move that newline into this format string:
# nushell strips one trailing newline off external command output, so
# starship's own would never reach reedline.
format = "$all"

[aws]
symbol = " "

[azure]
symbol = " "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[character]
disabled = true

[cmake]
symbol = " "

[cobol]
symbol = " "

[conda]
