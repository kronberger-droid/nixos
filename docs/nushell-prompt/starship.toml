[directory]
read_only = " 󰌾"

# Relabel long, uninteresting paths to short names (git-repo-like). Applied
# before truncation, so the label only survives within `truncation_length`
# (default 3) folders of the root — same as how starship shows a real repo's
# name. Matched against the ~-contracted path, so keys start with ~, not /home.
[directory.substitutions]
"~/Documents/notes/general-vault" = "vault"

